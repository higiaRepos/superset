version: '3.7'

services:
  superset:
    build: .
    container_name: superset
    network_mode: host
    environment:
      - SUPERSET_LOAD_EXAMPLES=no
    env_file:
      - .env
    volumes:
      - superset_volume:/app/superset_home
      - /home/45647504W/certs:/app/certs:ro
      - ./superset_config.py:/app/pythonpath/superset_config.py
    healthcheck:
      test: curl --fail http://localhost:8088/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  superset_volume:

